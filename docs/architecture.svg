<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img">
<title>text2sql 架構：出題、考卷、問答系統、批改、成績單</title>
<desc>人與 AI 決定考什麼並寫出題目與 SQL；出題程式把 SQL 拿到資料庫算出標準答案，部分題目另由模型改寫問法，組成考卷。批改程式把考卷的題目交給問答系統、收回答案，由程式比對答案與圖表並產出成績單。產品區在右側：使用者透過網頁向問答系統提問，問答系統唯讀查詢資料庫並產出答案。</desc>
<style>
text { font-family: "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", "PingFang TC", sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.arr { stroke: #73726C; stroke-width: 1.2; fill: none; }
.out rect { fill: #FFFFFF; stroke: #B4B2A9; stroke-width: 0.8; stroke-dasharray: 4 3; }
.purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; }
.purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
.teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
.coral rect { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.8; }
.coral .th { fill: #712B13; } .coral .ts { fill: #993C1D; }
.amber rect { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.8; } .amber .th { fill: #633806; }
.green rect { fill: #EAF3DE; stroke: #3B6D11; stroke-width: 0.8; } .green .th { fill: #27500A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="760" height="560" fill="#FFFFFF"/>

<g class="green"><rect x="530" y="210" width="200" height="282" rx="12"/><text class="th" x="630" y="228" text-anchor="middle">產品區：使用者會用到的</text></g>

<g class="out"><rect x="540" y="30" width="180" height="56" rx="8"/><text class="th" x="630" y="50" text-anchor="middle" dominant-baseline="central">資料庫</text><text class="ts" x="630" y="69" text-anchor="middle" dominant-baseline="central">銷售資料 3 萬筆，2023–2024</text></g>
<path d="M536 58 L340 58 L340 126" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="438" y="48" text-anchor="middle">用 SQL 算出標準答案</text>
<line x1="630" y1="88" x2="630" y2="206" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="642" y="150" text-anchor="start">唯讀查詢</text>

<g class="out"><rect x="40" y="130" width="180" height="56" rx="8"/><text class="th" x="130" y="150" text-anchor="middle" dominant-baseline="central">人／AI</text><text class="ts" x="130" y="169" text-anchor="middle" dominant-baseline="central">決定考什麼，寫題目與 SQL</text></g>
<line x1="224" y1="158" x2="246" y2="158" class="arr" marker-end="url(#arrow)"/>
<g class="purple"><rect x="250" y="130" width="180" height="56" rx="8"/><text class="th" x="340" y="150" text-anchor="middle" dominant-baseline="central">出題</text><text class="ts" x="340" y="169" text-anchor="middle" dominant-baseline="central">算標準答案，部分題目換說法</text></g>
<line x1="340" y1="188" x2="340" y2="226" class="arr" marker-end="url(#arrow)"/>
<g class="out"><rect x="250" y="230" width="180" height="56" rx="8"/><text class="th" x="340" y="250" text-anchor="middle" dominant-baseline="central">考卷</text><text class="ts" x="340" y="269" text-anchor="middle" dominant-baseline="central">271 題，分四組</text></g>
<line x1="340" y1="288" x2="340" y2="326" class="arr" marker-end="url(#arrow)"/>
<g class="coral"><rect x="250" y="330" width="180" height="56" rx="8"/><text class="th" x="340" y="350" text-anchor="middle" dominant-baseline="central">批改</text><text class="ts" x="340" y="369" text-anchor="middle" dominant-baseline="central">程式比對答案與圖表</text></g>
<line x1="340" y1="388" x2="340" y2="426" class="arr" marker-end="url(#arrow)"/>
<g class="out"><rect x="250" y="430" width="180" height="56" rx="8"/><text class="th" x="340" y="450" text-anchor="middle" dominant-baseline="central">成績單</text><text class="ts" x="340" y="469" text-anchor="middle" dominant-baseline="central">答對 + 拒答 + 誤擋率</text></g>

<g class="teal"><rect x="540" y="240" width="180" height="56" rx="8"/><text class="th" x="630" y="260" text-anchor="middle" dominant-baseline="central">網頁</text><text class="ts" x="630" y="279" text-anchor="middle" dominant-baseline="central">使用者從這裡提問</text></g>
<line x1="630" y1="300" x2="630" y2="326" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="teal"><rect x="540" y="330" width="180" height="56" rx="8"/><text class="th" x="630" y="350" text-anchor="middle" dominant-baseline="central">問答系統</text><text class="ts" x="630" y="369" text-anchor="middle" dominant-baseline="central">查資料、回答</text></g>
<line x1="630" y1="388" x2="630" y2="416" class="arr" marker-end="url(#arrow)"/>
<g class="out"><rect x="540" y="420" width="180" height="56" rx="8"/><text class="th" x="630" y="440" text-anchor="middle" dominant-baseline="central">答案</text><text class="ts" x="630" y="459" text-anchor="middle" dominant-baseline="central">表格 + 圖 + 說明</text></g>

<line x1="434" y1="358" x2="536" y2="358" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="485" y="348" text-anchor="middle">出題、收答案</text>

<text class="ts" x="380" y="526" text-anchor="middle">實線彩色框 = 程式　虛線框 = 人、資料或產出　綠底 = 產品區，其餘都為了測試它而存在</text>
</svg>
