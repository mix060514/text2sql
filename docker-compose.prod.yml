
name: text2sql-prod

services:
  webui:
    container_name: text2sql-webui-prod
    image: text2sql-webui:v1.0.0
    restart: always
    ports:
      - "8501:8501"
    environment:
      - WATCH_FILES=false
      - LLAMA_CPP_API_BASE=http://llama-cpp:8080
      - LLAMA_CPP_VL_API_BASE=http://llama-cpp-vl:8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - default
      - ai-stack_default

networks:
  ai-stack_default:
    external: true
